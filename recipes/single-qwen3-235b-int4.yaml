# Recipe: Qwen3-235B-A22B INT4 — SINGLE POWERFUL MODE
# Use when maximum quality is needed with a single model
# REQUIRES: stop other containers before starting
# RAM: ~115GB | tok/s: ~15-18 | Contexto: 32k
recipe_version: "1"
name: Qwen3-235B-A22B-INT4
description: |
  MODO SINGLE POWERFUL - Para el resto de containers antes de usar.
  Qwen3-235B con 22B activos (MoE). Reasoning adaptativo nativo.
  Mejor modelo open-source para coding y agentes en single-GPU.

model: Qwen/Qwen3-235B-A22B-FP8

container: vllm-node

solo_only: true

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.92
  max_model_len: 32768
  max_num_seqs: 4
  max_num_batched_tokens: 8192

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1

command: |
  vllm serve Qwen/Qwen3-235B-A22B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --max-num-seqs {max_num_seqs} \
    --trust-remote-code \
    --compilation-config '{{"cudagraph_capture_sizes":[1,2,4]}}'
