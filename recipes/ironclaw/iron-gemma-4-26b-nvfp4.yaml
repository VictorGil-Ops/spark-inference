# Recipe: Gemma-4-26B-A4B-NVFP4
# Multimodal (image). enable-chunked-prefill required — model's max_tokens_per_mm_item (2496) > default max_num_batched_tokens (2048)
# Memory: ~117GB | tok/s: ~29
recipe_version: "1"
name: Gemma-4-26B-A4B-NVFP4
description: nvidia/Gemma-4-26B-A4B-NVFP4 multimodal (port 8200)

model: nvidia/Gemma-4-26B-A4B-NVFP4
container: vllm-node
solo_only: true

mods:
  - mods/gemma4

defaults:
  port: 8200
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 131072
  max_num_batched_tokens: 65536
  max_num_seqs: 128

command: |
  vllm serve nvidia/Gemma-4-26B-A4B-NVFP4 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-chunked-prefill \
    --attention-backend triton_attn \
    --load-format safetensors \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser gemma4 \
    --chat-template gemma4.jinja \
    --chat-template-content-format string \
