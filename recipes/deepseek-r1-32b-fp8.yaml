# Recipe: DeepSeek-R1-32B-FP8 — Memory optimized for DGX Spark
# Memory: ~25GB | tok/s: ~20-25 single-user
recipe_version: "1"
name: DeepSeek-R1-32B-FP8
description: vLLM serving DeepSeek-R1-0528-FP8 — reasoning + pentest + OSINT (port 8002)

model: deepseek-ai/DeepSeek-R1-0528-FP8
container: vllm-node
solo_only: true
defaults:
  port: 8002
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.20
  max_model_len: 32768
  max_num_seqs: 4
command: |
  vllm serve deepseek-ai/DeepSeek-R1-0528-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --enforce-eager \
    --reasoning-parser deepseek_r1 \
    --enable-auto-tool-choice \
    --tool-call-parser hermes \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --trust-remote-code
