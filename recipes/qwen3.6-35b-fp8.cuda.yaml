# Recipe: Qwen3.6-35B-A3B-FP8 — CUDA graphs (single/dual model mode)
# Use when running 1 or 2 models simultaneously (not 3)
# tok/s: ~53.7 | RAM: ~67GB | CUDA graphs: enabled
recipe_version: "1"
name: Qwen3.6-35B-A3B-FP8-CUDA
description: Qwen3.6-35B FP8 with CUDA graphs — max throughput, single/dual model mode (port 8001)

model: Qwen/Qwen3.6-35B-A3B-FP8
container: vllm-node
solo_only: true

defaults:
  port: 8001
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.50
  max_model_len: 32768
  max_num_batched_tokens: 8192
  max_num_seqs: 128

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1

command: |
  vllm serve Qwen/Qwen3.6-35B-A3B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --kv-cache-dtype fp8 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --trust-remote-code \
    --compilation-config '{{"cudagraph_capture_sizes":[1,2,4,8,16,32,64,128]}}'
