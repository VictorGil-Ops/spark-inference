# Recipe: Qwen3.5-122B-A10B-iNT4-AutoRound — opencode mode
# Intel AutoRound INT4 + bfloat16 KV cache — quality-first for long coding tasks
# tok/s: ~24 | RAM: ~63GB | Context: 196K
# Source: https://forums.developer.nvidia.com/t/bfloat16-quality-speed/366828
recipe_version: "1"
name: Qwen3.5-122B-A10B-int4-AutoRound
description: |
  Intel AutoRound INT4 quantization with bfloat16 KV cache.
  Quality-first setup for long coding tasks (100K+ context).
  ~24 tok/s sustained, prefix cache hit >90% on typical coding sessions.

model: Intel/Qwen3.5-122B-A10B-int4-AutoRound
container: vllm-node
solo_only: true

mods:
  - mods/fix-qwen3.5-enhanced-chat-template

defaults:
  port: 8300
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.82
  max_model_len: 196608
  max_num_batched_tokens: 32768
  max_num_seqs: 8
  served_model_name: qwen/qwen3.5

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1

command: |
  vllm serve Intel/Qwen3.5-122B-A10B-int4-AutoRound \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --dtype bfloat16 \
    --load-format fastsafetensors \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --tool-call-parser qwen3_xml \
    --chat-template /root/.cache/huggingface/chat-templates/qwen3.5-enhanced.jinja \
    --chat-template-content-format string \
    --reasoning-parser qwen3 \
    --trust-remote-code \
    --generation-config auto