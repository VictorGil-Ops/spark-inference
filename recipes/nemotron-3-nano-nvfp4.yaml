# Recipe: Nemotron-3-Nano-NVFP4 — Memory optimized for DGX Spark
# Based on sggin1's memory analysis (forums.developer.nvidia.com/t/364886)
# Memory: ~32GB (vs 117GB default) | tok/s: ~50-58
recipe_version: "1"
name: Nemotron-3-Nano-NVFP4
description: vLLM serving Nemotron-3-Nano-NVFP4 — memory optimized for multi-model stack

model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
container: vllm-node
solo_only: true

mods:
  - mods/nemotron-nano
env:
  VLLM_USE_FLASHINFER_MOE_FP4: 0
  VLLM_NVFP4_GEMM_BACKEND: marlin
  VLLM_TEST_FORCE_FP8_MARLIN: 1
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.25
  max_model_len: 32768
  max_num_seqs: 8
command: |
  vllm serve nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --enforce-eager \
    --moe-backend cutlass \
    --kv-cache-dtype fp8 \
    --enable-prefix-caching \
    --load-format fastsafetensors \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser-plugin nano_v3_reasoning_parser.py \
    --reasoning-parser nano_v3
